<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kantor Desa Kamangta</title>
    <!-- PWA Manifest & Theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="container px-3">
    <div class="card card-absensi">
        <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-building-user me-2"></i>Absensi Kantor Desa Kamangta</h5>
            <small id="live-clock" class="text-white-50"></small>
        </div>

        <div class="text-center mt-2">
            <img src="icon-svg.svg" alt="" style="width: 150px; height: 150px;">
        </div>
       
        <div class="card-body p-4">
            
            <form id="absensi-form">
                <!-- 1. Pilih Nama Aparat -->
                <div class="mb-3">
                    <label for="nama_aparat" class="form-label fw-semibold">Nama Aparat Desa</label>
                    <select class="form-select" id="nama_aparat" required>
                        <option value="" disabled selected>-- Pilih Nama Anda --</option>
                        <option value="Hukum Tua">Hukum Tua (Kepala Desa)</option>
                        <option value="Sekretaris Desa">Sekretaris Desa</option>
                        <option value="Kaur Keuangan">Kaur Keuangan</option>
                        <option value="Kaur Perencanaan">Kaur Perencanaan</option>
                        <option value="Kepala Jaga 1">Kepala Jaga 1</option>
                        <option value="Kepala Jaga 2">Kepala Jaga 2</option>
                        <option value="Kepala Jaga 3">Kepala Jaga 3</option>
                        <option value="Kepala Jaga 4">Kepala Jaga 4</option>
                        <option value="Kepala Jaga 5">Kepala Jaga 5</option>
                        <option value="Kepala Jaga 6">Kepala Jaga 6</option>
                        <option value="Kepala Jaga 7">Kepala Jaga 7</option>
                    </select>
                </div>

                <!-- 2. Pilih Tipe Absen -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tipe Absen</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="tipe_absen" id="absen_masuk" value="masuk" checked>
                        <label class="btn btn-outline-primary" for="absen_masuk">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Absen Masuk
                        </label>

                        <input type="radio" class="btn-check" name="tipe_absen" id="absen_pulang" value="pulang">
                        <label class="btn btn-outline-danger" for="absen_pulang">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Absen Pulang
                        </label>
                    </div>
                </div>

                <!-- 3. Status Lokasi GPS -->
                <div class="mb-3 text-center">
                    <div id="status-gps" class="status-badge alert alert-warning mb-0">
                        <i class="fa-solid fa-spinner fa-spin me-1"></i> Mengambil Lokasi GPS...
                    </div>
                </div>

                <!-- 4. Area Kamera (Hanya Tampil Saat Absen Masuk) -->
                <div id="kamera-section" class="mb-3">
                    <label class="form-label fw-semibold">Foto Bukti Kehadiran</label>
                    <div id="webcam-container" class="mb-2">
                        <!-- Live Video Kamera -->
                        <video id="video" autoplay playsinline></video>
                        <!-- Preview Gambar Hasil Foto -->
                        <img id="photo-preview" class="d-none" alt="Hasil Foto">
                        <!-- Canvas Tersembunyi untuk Proses Capture -->
                        <canvas id="canvas" class="d-none"></canvas>
                    </div>
                    <button type="button" id="btn-capture" class="btn btn-secondary w-100">
                        <i class="fa-solid fa-camera me-1"></i> Ambil Foto
                    </button>
                    <button type="button" id="btn-retake" class="btn btn-outline-secondary w-100 d-none">
                        <i class="fa-solid fa-rotate-left me-1"></i> Foto Ulang
                    </button>
                </div>

                <!-- Hidden Input Data -->
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">
                <input type="hidden" id="foto_base64">

                <!-- 5. Tombol Submit Absen -->
                <button type="submit" id="btn-submit" class="btn btn-success w-100 py-2 fs-6 fw-bold" disabled>
                    <i class="fa-solid fa-paper-plane me-1"></i> Kirim Absensi
                </button>
                
            </form>

             <!-- Tombol Install PWA (Opsional) -->
<button type="button" id="btn-install" class="btn btn-outline-primary w-100 mt-5 d-none">
    <i class="fa-solid fa-download me-1"></i> Install Aplikasi di HP
</button>
            

        </div>
    </div>
</div>

<!-- JavaScript Bootstrap & SweetAlert2 untuk Alert Cantik -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>

</body>
</html>
